# Extends gitleaks' built-in ruleset rather than replacing it — every default
# rule stays active, and only the specific placeholders below are exempted.
[extend]
useDefault = true

[allowlist]
description = """
Placeholder values that gitleaks' generic-api-key rule flags because they sit
next to a name like PROVIDER_API_KEY, but which are not credentials.

Each entry is narrow on purpose: a broad path or rule exclusion would also hide
a real key committed to the same file later. If you add an entry here, state
what the value is and why it cannot be a secret.

Replace the examples below with your own repo's placeholders — these are the
ones a Bun + Hono backend accumulates, and they are here to show the shape.
"""
regexTarget = "match"
regexes = [
  # A stub-mode sentinel: the value that TURNS OFF real sending in development.
  # If it ever reached the provider it would simply be rejected.
  '''stub_mode_not_a_real_key''',
  # The spec export script (e.g. scripts/generate/openapi.ts) — env validation
  # runs on import, so the export must satisfy the schema before importing the
  # app. Every value in that map is the word "placeholder" padded to length.
  '''placeholder-32-characters-long-ok''',
  # scripts/check/hook-probes.sh plants this JWT-shaped value in a throwaway .env fixture to prove
  # scripts/env/show.sh masks it. It decodes to {"alg":"HS256"}.{"sub":"probe"} with a literal
  # "probeSignatureValue9" signature, so no service would accept it.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJwcm9iZSJ9\.probeSignatureValue9''',
]

paths = [
  # Committed example env files hold placeholder values by definition. The
  # gate's separate "Check .env Not Committed" step is what stops a real .env
  # from being committed — that check is not weakened by this.
  '''\.env\.example$''',
  '''\.env\.[a-z]+\.example$''',
]
