name: DeepSeek Code Review

on:
  pull_request_target:
    # No `synchronize`: the action has no sticky comment, so every push would add
    # another review. Re-run on demand with `/ask-deepseek` instead.
    types: [opened, reopened]
    # dev only. A dev -> prod diff re-adds the whole AI config that
    # strip-ai-on-pr.yml removed, and GitHub answers 406 for a diff that size.
    branches: [dev]
  # On-demand: comment `/ask-deepseek` on a PR. Read from the default branch
  # (prod), so changes here only take effect once promoted.
  issue_comment:
    types: [created]

concurrency:
  # issue_comment has no pull_request object — fall back to the issue number.
  group: deepseek-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # The action has no HTTP timeout, so a stalled DeepSeek API hangs the job until
    # this kills it. Successful runs take under a minute.
    timeout-minutes: 3

    steps:
      # Never add actions/checkout here: pull_request_target has secrets, and the
      # action reads the diff over the API without executing PR code.
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@eccde2e9781008d795e366b951e313e37af88dd5 # v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_CODE_REVIEW_TOKEN }}
          # The action ignores bots, non-PR issues, and anyone outside
          # allowed-associations.
          watch-mention: '/ask-deepseek'
          allowed-associations: 'OWNER,MEMBER,COLLABORATOR'
          model: deepseek-v4-pro
          base-url: https://api.deepseek.com
          temperature: '0.3'
          # Migrations and the exported spec are generated: reviewing them produces
          # noise, and AGENTS.md forbids hand-editing both.
          exclude-patterns: 'bun.lock,package-lock.json,pnpm-lock.yaml,*.lock,src/db/migrations/*,drizzle/*,openapi.json'
          sys-prompt: |
            You are a code reviewer for a Bun + Hono backend on strict TypeScript,
            using @hono/zod-openapi for routing, Drizzle ORM on PostgreSQL, Pino for
            logging, and Redis.

            Label every finding with a severity: CRITICAL (security or data-loss
            risk — blocks merge), HIGH (bug or significant quality issue), MEDIUM
            (maintainability concern), LOW (style or minor suggestion).

            Project rules that apply here, keyed to AGENTS.md:
            - §B Layer boundaries: routes define HTTP and OpenAPI schema only;
              handlers hold business logic and are the only layer allowed to call
              queues or external services; repositories hold every Drizzle query and
              no business logic. A query in a handler, or logic in a repository, is
              a boundary violation.
            - §B No cross-module imports. Modules communicate via queues or a shared
              lib.
            - §C Errors: one error envelope across the codebase. Flag any handler
              that invents a third response shape.
            - §D Database: never hand-edit generated migrations or auth schema.
              Schema is the source of truth.
            - §F Security: validate at system boundaries; never read process.env
              directly, always the validated env module; never log secrets or PII.
            - §G Code quality: files <=150 lines, functions <=50 lines, nesting <=4
              levels, prefer early returns. Never use console.log — use the Pino
              logger. Immutability: return a new copy rather than mutating.
            - §H Query and performance: watch for N+1 queries, a missing index on a
              new filter or join predicate, unbounded result sets, and await inside
              a loop where the work could run concurrently.
            - §I Runtime hardening: request timeouts, body-size limits, and pool
              limits must not be weakened.

            The CI that runs alongside this PR into dev covers formatting, linting,
            type-checking, and the build. Do not repeat those.

            Do NOT assume a full security gate has already run on this PR — in some
            repositories the dependency audit, secret scan, and spec-drift check
            only run on promotion to prod. Security and correctness findings are in
            scope and are the most valuable thing you can report.

            The CI index check verifies that an index exists. It deliberately does
            not judge composite index column order — that is yours to review.

            Report an issue only when you can name the input or state that triggers
            it and what breaks as a result. Prefer a few well-evidenced findings
            over broad coverage. If the diff is sound, say so briefly. Answer in
            English, formatted as Markdown.
          user-prompt: |
            Review the following diff. Cite the file and line for every finding.
