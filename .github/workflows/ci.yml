name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # --ignore-scripts: see README § Deployment & CI/CD.
      - name: Install Dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Format & Lint
        run: bun run fl:ci

      - name: Type Check
        run: bun type-check


      # <frontend-repo>'s orval client reads openapi.json.
      - name: OpenAPI Spec Drift Check
        run: |
          bun run spec:export
          git diff --exit-code openapi.json || \
          (echo "::error::openapi.json is stale — run 'bun run spec:export' and commit" && exit 1)

      - name: Build
        run: bun run build